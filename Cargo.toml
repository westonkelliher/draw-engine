[package]
name = "draw_engine"
version = "0.1.0"
edition = "2021"
description = "A 2D draw engine built on wgpu: retained scene graph compiled to GPU draw calls through pure, testable layers."

[dependencies]
wgpu = "29"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
glyphon = "0.11"

[dev-dependencies]
env_logger = "0.11"

[[example]]
name = "demo"
path = "examples/demo.rs"
